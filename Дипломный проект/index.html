<!doctype html>
<html class="page" lang="ru">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="stylesheet" href="./css/index.css" />
		<title>PROJECT</title>
	</head>
	<body class="page__body">
		<header class="header">
			<div class="container header__container">
				<a class="logo header__logo" href="#">
					<img
						class="logo__img"
						src="./icons/logo-icon.svg"
						width="170"
						height="21"
						alt="Логотип CALIFORNIA"
					/>
				</a>
				<nav class="menu header__menu" aria-label="Главное меню">
					<ul class="menu__list">
						<li class="menu__item">
							<a class="menu__link" href="#all-products" lang="en"
								>all products</a
							>
						</li>
						<li class="menu__item">
							<a class="menu__link" href="#Solutions" lang="en">
								Solutions
								<button class="menu__link-arrow-bottom">
									<svg width="12" height="10">
										<use
											class="header__details-icon"
											href="./icons/main-sptite.svg#arrow-bottom"
										></use>
									</svg>
								</button>
							</a>
						</li>
						<li class="menu__item">
							<a class="menu__link" href="#ABOUT" lang="en">ABOUT</a>
						</li>
						<li class="menu__item">
							<a class="menu__link" href="#Support" lang="en">Support</a>
						</li>
					</ul>
				</nav>
				<div class="header__controls">
					<div class="header__actions">
						<button class="header__actions-button">
							<svg width="24" height="24">
								<use
									class="header__actions-icon"
									href="./icons/sprite.svg#search"
								></use>
							</svg>
						</button>
						<button class="header__actions-button">
							<svg width="24" height="24">
								<use
									class="header__actions-icon"
									href="./icons/sprite.svg#cart"
								></use>
							</svg>
						</button>
					</div>
				</div>
			</div>
		</header>
		<main class="main">
			<section class="hero">
				<div class="container hero__container sizes__slider-position">
					<div class="hero__background">
						<button class="sizes__slider-button sizes__slider-button--prev" aria-label="Предыдущий слайд"></button>
							<svg width="14" height="26">
								<use href="icons/main-sptite.svg#arrow-left">

								</use>
							</svg>
						</button>
						<header class="hero__header">
							<div class="hero__section">
								<div>
									<h1 class="hero__title title">
										The new phones are here take a look.
									</h1>
									<p class="hero__paragraph text">
										Lorem ipsum dolor sit amet, consectetur adipiscing elit
										Scelerisque in est dui, aliquam, tempor. Faucibus morbi
										turpis.
									</p>
									<a class="button" href="#">Explore</a>
								</div>
								<div class="hero__image-phones">
									<picture>
										<img
											class="hero__img"
											src="./images/IMAGE.png"
											width="647"
											alt="Телефон марки Apple"
										/>
									</picture>
								</div>
							</div>
						</header>
						<button class="sizes__slider-button sizes__slider-button--next" aria-label="Следующий слайд"></button>
							<svg width="14" height="26">
								<use
								href="icons/main-sptite.svg#arrow-left">
								</use>
							</svg>
						</button>
						<footer class="hero__footer"></footer>
					</div>
				</div>
			</section>
		</main>
	</body>
</html>
